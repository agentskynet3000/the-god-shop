<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE GOD SHOP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garant:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --gold: #C9A84C;
      --gold-warm: #D4A853;
      --gold-dim: rgba(201, 168, 76, 0.6);
      --bg-base: #FDFBF7;
      --text-dark: #1A1208;
      --text-mid: rgba(44, 36, 22, 0.65);
      --text-dim: rgba(44, 36, 22, 0.4);
    }

    html, body {
      height: 100%;
    }

    /* ─── KEYFRAMES ─── */

    @keyframes auroraBlob1 {
      0%   { transform: translate(0%, 0%) scale(1); }
      25%  { transform: translate(5%, -8%) scale(1.12); }
      50%  { transform: translate(-4%, 6%) scale(0.94); }
      75%  { transform: translate(7%, 3%) scale(1.08); }
      100% { transform: translate(0%, 0%) scale(1); }
    }

    @keyframes auroraBlob2 {
      0%   { transform: translate(0%, 0%) scale(1); }
      33%  { transform: translate(-7%, 7%) scale(1.14); }
      66%  { transform: translate(5%, -5%) scale(0.9); }
      100% { transform: translate(0%, 0%) scale(1); }
    }

    @keyframes auroraBlob3 {
      0%   { transform: translate(0%, 0%) scale(1); }
      40%  { transform: translate(9%, -6%) scale(1.16); }
      80%  { transform: translate(-5%, 8%) scale(0.91); }
      100% { transform: translate(0%, 0%) scale(1); }
    }

    @keyframes morphBlob1 {
      0%   { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
      25%  { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
      50%  { border-radius: 50% 50% 40% 60% / 40% 50% 60% 50%; }
      75%  { border-radius: 40% 60% 60% 40% / 60% 40% 50% 60%; }
      100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
    }

    @keyframes morphBlob2 {
      0%   { border-radius: 40% 60% 60% 40% / 40% 50% 60% 50%; }
      30%  { border-radius: 60% 40% 40% 60% / 60% 30% 70% 40%; }
      60%  { border-radius: 30% 70% 50% 50% / 50% 60% 30% 70%; }
      100% { border-radius: 40% 60% 60% 40% / 40% 50% 60% 50%; }
    }

    @keyframes glowPulse {
      0%   { opacity: 0.65; transform: scale(1.0); }
      50%  { opacity: 0.92; transform: scale(1.09); }
      100% { opacity: 0.65; transform: scale(1.0); }
    }

    @keyframes rayRotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ─── BASE ─── */

    body {
      background-color: var(--bg-base);
      color: var(--text-dark);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
    }

    /* ─── AURORA BACKGROUND LAYER 1 — pastel blob field ─── */

    html::before {
      content: '';
      position: fixed;
      inset: -30%;
      background:
        radial-gradient(ellipse 60% 50% at 20% 30%, rgba(232, 224, 245, 0.72) 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 82% 18%, rgba(245, 224, 234, 0.66) 0%, transparent 55%),
        radial-gradient(ellipse 70% 45% at 58% 82%, rgba(224, 245, 238, 0.62) 0%, transparent 55%),
        radial-gradient(ellipse 55% 55% at 14% 76%, rgba(245, 235, 224, 0.58) 0%, transparent 60%);
      animation: auroraBlob1 20s ease-in-out infinite;
      z-index: 0;
      pointer-events: none;
    }

    /* ─── AURORA BACKGROUND LAYER 2 — secondary drift ─── */

    html::after {
      content: '';
      position: fixed;
      inset: -25%;
      background:
        radial-gradient(ellipse 45% 65% at 76% 44%, rgba(232, 224, 245, 0.52) 0%, transparent 55%),
        radial-gradient(ellipse 65% 40% at 28% 66%, rgba(245, 224, 234, 0.46) 0%, transparent 50%),
        radial-gradient(ellipse 50% 55% at 52% 14%, rgba(253, 245, 230, 0.62) 0%, transparent 60%),
        radial-gradient(ellipse 40% 50% at 88% 85%, rgba(224, 245, 238, 0.4) 0%, transparent 55%);
      animation: auroraBlob2 27s ease-in-out infinite;
      z-index: 0;
      pointer-events: none;
    }

    /* ─── MORPHING BLOB 1 — upper-left ─── */

    body::before {
      content: '';
      position: fixed;
      width: 44vw;
      height: 44vw;
      top: -6%;
      left: -8%;
      background: radial-gradient(ellipse at 45% 50%,
        rgba(232, 224, 245, 0.22) 0%,
        rgba(245, 224, 234, 0.12) 50%,
        transparent 70%
      );
      animation: morphBlob1 22s ease-in-out infinite, auroraBlob3 28s ease-in-out infinite;
      z-index: 0;
      pointer-events: none;
    }

    /* ─── MORPHING BLOB 2 — lower-right ─── */

    body::after {
      content: '';
      position: fixed;
      width: 52vw;
      height: 52vw;
      bottom: -14%;
      right: -14%;
      background: radial-gradient(ellipse at 55% 50%,
        rgba(224, 245, 238, 0.2) 0%,
        rgba(245, 235, 224, 0.1) 50%,
        transparent 70%
      );
      animation: morphBlob2 26s ease-in-out infinite, auroraBlob1 32s ease-in-out infinite reverse;
      z-index: 0;
      pointer-events: none;
    }

    /* ─── HEADER ─── */

    .site-header {
      text-align: center;
      padding-top: clamp(14px, 2.5vh, 28px);
      position: relative;
      z-index: 1;
      flex-shrink: 0;
    }

    .site-name {
      font-family: 'Cormorant Garant', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(1.8rem, 4.5vw, 3rem);
      letter-spacing: 0.04em;
      line-height: 1.1;
      color: var(--text-dark);
    }

    .site-name .gold {
      color: var(--gold-warm);
    }

    .site-tagline {
      margin-top: 6px;
      font-family: 'Cormorant Garant', serif;
      font-style: normal;
      font-weight: 300;
      font-size: clamp(0.6rem, 1.2vw, 0.78rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    /* ─── VIDEO AREA ─── */

    .video-area {
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* divine glow wrapper */
    .video-glow {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* massive soft radial halo — 150%+ size, breathing */
    .video-glow::before {
      content: '';
      position: absolute;
      inset: -58%;
      border-radius: 50%;
      background: radial-gradient(ellipse 78% 88% at 50% 50%,
        rgba(255, 253, 248, 0.98) 0%,
        rgba(255, 251, 238, 0.75) 18%,
        rgba(253, 245, 220, 0.48) 38%,
        rgba(232, 224, 245, 0.22) 58%,
        rgba(245, 224, 234, 0.08) 70%,
        transparent 78%
      );
      animation: glowPulse 3.5s ease-in-out infinite;
      pointer-events: none;
      z-index: -1;
    }

    /* conic ray burst — ghostly white/cream on light bg */
    .video-glow::after {
      content: '';
      position: absolute;
      inset: -68%;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        rgba(255, 255, 255, 0.14) 4deg,
        transparent 8deg,
        rgba(255, 252, 240, 0.09) 14deg,
        transparent 18deg,
        rgba(255, 255, 255, 0.12) 22deg,
        transparent 28deg,
        rgba(255, 252, 240, 0.07) 34deg,
        transparent 38deg,
        rgba(255, 255, 255, 0.14) 44deg,
        transparent 50deg,
        rgba(255, 252, 240, 0.09) 56deg,
        transparent 62deg,
        rgba(255, 255, 255, 0.12) 66deg,
        transparent 72deg,
        rgba(255, 252, 240, 0.07) 78deg,
        transparent 84deg,
        rgba(255, 255, 255, 0.14) 90deg,
        transparent 96deg,
        rgba(255, 252, 240, 0.09) 104deg,
        transparent 110deg,
        rgba(255, 255, 255, 0.12) 116deg,
        transparent 122deg,
        rgba(255, 252, 240, 0.07) 130deg,
        transparent 136deg,
        rgba(255, 255, 255, 0.14) 144deg,
        transparent 150deg,
        rgba(255, 252, 240, 0.09) 158deg,
        transparent 164deg,
        rgba(255, 255, 255, 0.12) 170deg,
        transparent 176deg,
        rgba(255, 252, 240, 0.07) 182deg,
        transparent 188deg,
        rgba(255, 255, 255, 0.14) 196deg,
        transparent 202deg,
        rgba(255, 252, 240, 0.09) 210deg,
        transparent 216deg,
        rgba(255, 255, 255, 0.12) 222deg,
        transparent 228deg,
        rgba(255, 252, 240, 0.07) 234deg,
        transparent 240deg,
        rgba(255, 255, 255, 0.14) 248deg,
        transparent 254deg,
        rgba(255, 252, 240, 0.09) 262deg,
        transparent 268deg,
        rgba(255, 255, 255, 0.12) 274deg,
        transparent 280deg,
        rgba(255, 252, 240, 0.07) 286deg,
        transparent 292deg,
        rgba(255, 255, 255, 0.14) 298deg,
        transparent 304deg,
        rgba(255, 252, 240, 0.09) 312deg,
        transparent 318deg,
        rgba(255, 255, 255, 0.12) 324deg,
        transparent 330deg,
        rgba(255, 252, 240, 0.07) 336deg,
        transparent 342deg,
        rgba(255, 255, 255, 0.14) 350deg,
        transparent 356deg,
        transparent 360deg
      );
      animation: rayRotate 18s linear infinite;
      pointer-events: none;
      z-index: -1;
      mask-image: radial-gradient(ellipse 78% 88% at 50% 50%, black 25%, transparent 76%);
      -webkit-mask-image: radial-gradient(ellipse 78% 88% at 50% 50%, black 25%, transparent 76%);
    }

    .manifestation-video {
      display: block;
      width: clamp(160px, 24vw, 320px);
      height: auto;
      max-height: clamp(200px, 46vh, 520px);
      object-fit: cover;
      background: #F5F0E8;
      box-shadow:
        0 0 0 1px rgba(255, 253, 245, 0.9),
        0 0 28px rgba(255, 255, 255, 0.95),
        0 0 65px rgba(255, 251, 232, 0.65),
        0 0 110px rgba(255, 248, 218, 0.35),
        0 0 160px rgba(232, 224, 245, 0.18),
        0 8px 40px rgba(44, 36, 22, 0.06);
      position: relative;
      z-index: 1;
    }

    /* ─── PRODUCT INFO ─── */

    .product-info {
      text-align: center;
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      padding: 0 16px;
    }

    .product-verse {
      font-family: 'Cormorant Garant', serif;
      font-weight: 400;
      font-style: normal;
      font-size: clamp(0.6rem, 1.1vw, 0.75rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-mid);
      line-height: 1.6;
      margin-bottom: 4px;
    }

    .product-name {
      font-family: 'Cormorant Garant', serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(1.1rem, 2.6vw, 1.7rem);
      letter-spacing: 0.06em;
      color: var(--gold-warm);
      line-height: 1.2;
    }

    .product-actions {
      margin-top: clamp(6px, 1.2vh, 14px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .price {
      font-family: 'Cormorant Garant', serif;
      font-weight: 300;
      font-size: clamp(1rem, 2vw, 1.35rem);
      letter-spacing: 0.08em;
      color: var(--text-mid);
    }

    .btn-buy {
      padding: 9px 22px;
      background: transparent;
      color: var(--gold-warm);
      border: 1px solid rgba(212, 168, 83, 0.45);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 0.6rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
      line-height: 1;
      white-space: nowrap;
    }

    .btn-buy:hover:not(:disabled) {
      background: rgba(212, 168, 83, 0.08);
      border-color: var(--gold-warm);
      box-shadow: 0 0 22px rgba(212, 168, 83, 0.14);
    }

    .btn-buy:disabled,
    body[data-state="sold-out"] .btn-buy {
      color: rgba(212, 168, 83, 0.32);
      border-color: rgba(212, 168, 83, 0.18);
      cursor: not-allowed;
    }

    .stock-counter {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      color: var(--text-dim);
      margin-top: 6px;
      text-align: center;
    }

    body[data-state="sold-out"] .stock-counter {
      color: var(--gold-dim);
    }

    /* ─── COUNTDOWN ─── */

    .countdown-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 10px;
      margin-top: clamp(4px, 0.8vh, 10px);
    }

    .countdown-label {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .countdown-timer {
      font-family: 'Cormorant Garant', serif;
      font-weight: 300;
      font-size: clamp(0.85rem, 1.6vw, 1.1rem);
      letter-spacing: 0.1em;
      color: var(--text-mid);
      font-variant-numeric: tabular-nums;
    }

    /* ─── FOOTER NAV ─── */

    .site-footer {
      text-align: center;
      padding-bottom: clamp(12px, 2vh, 22px);
      position: relative;
      z-index: 1;
      flex-shrink: 0;
    }

    .footer-nav {
      font-family: 'Cormorant Garant', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(0.65rem, 1.2vw, 0.8rem);
      letter-spacing: 0.18em;
      color: var(--text-mid);
      list-style: none;
      display: flex;
      gap: 24px;
      justify-content: center;
    }

    .footer-nav a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-nav a:hover {
      color: var(--text-dark);
    }

    /* ─── BETWEEN-DROPS STATE ─── */

    body[data-state="between-drops"] .product-info {
      opacity: 0.45;
      pointer-events: none;
    }

    /* ─── MOBILE ─── */

    @media (max-width: 480px) {
      .product-actions {
        flex-direction: column;
        gap: 10px;
      }

      .footer-nav {
        gap: 16px;
      }
    }
  </style>
</head>
<body data-state="active">

  <!-- ─── HEADER ─── -->
  <header class="site-header">
    <h1 class="site-name">the-<span class="gold">god</span>-shop</h1>
    <p class="site-tagline">Daily Manifestation Altar</p>
  </header>

  <!-- ─── VIDEO ─── -->
  <div class="video-area">
    <div class="video-glow">
      <video
        class="manifestation-video"
        src="video.mp4"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
      ></video>
    </div>
  </div>

  <!-- ─── PRODUCT ─── -->
  <div class="product-info">
    <p class="product-verse">Today's Holy Manifestation:</p>
    <p class="product-name">Genesis 847:3 — The Silicone Spatula</p>

    <div class="product-actions">
      <span class="price">€79.00</span>
      <button class="btn-buy" id="buyBtn">Receive Thy Blessing</button>
    </div>
    <p class="stock-counter" id="stockCounter">3 of 7 blessings remaining</p>

    <div class="countdown-row">
      <span class="countdown-label">Next Manifestation</span>
      <span class="countdown-timer" id="countdown">--:--:--</span>
    </div>
  </div>

  <!-- ─── FOOTER ─── -->
  <footer class="site-footer">
    <ul class="footer-nav">
      <li><a href="#">Manifestations</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </footer>

  <script>
    // ─── COUNTDOWN TO NEXT 3:33 AM ───────────────────────────────────────────

    function getNext333AM() {
      const now = new Date();
      const target = new Date(now);
      target.setHours(3, 33, 0, 0);

      // If we've already passed 3:33 AM today, aim for tomorrow
      if (now >= target) {
        target.setDate(target.getDate() + 1);
      }

      return target;
    }

    function formatCountdown(ms) {
      if (ms <= 0) return '00:00:00';

      const totalSeconds = Math.floor(ms / 1000);
      const hours   = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      const pad = n => String(n).padStart(2, '0');
      return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
    }

    const countdownEl = document.getElementById('countdown');

    function tickCountdown() {
      const now = new Date();
      const target = getNext333AM();
      const diff = target - now;
      countdownEl.textContent = formatCountdown(diff);
    }

    tickCountdown();
    setInterval(tickCountdown, 1000);


    // ─── STATE MANAGEMENT ────────────────────────────────────────────────────

    const STOCK_TOTAL = 7;
    let stockRemaining = 3; // current mock state

    const buyBtn       = document.getElementById('buyBtn');
    const stockCounter = document.getElementById('stockCounter');

    function applyState() {
      const body = document.body;

      if (stockRemaining <= 0) {
        body.dataset.state = 'sold-out';
        buyBtn.textContent = 'God Has Spoken. All Blessings Claimed.';
        buyBtn.disabled = true;
        stockCounter.textContent = 'All 7 blessings have been claimed';
      } else {
        body.dataset.state = 'active';
        buyBtn.textContent = 'Receive Thy Blessing';
        buyBtn.disabled = false;
        const word = stockRemaining === 1 ? 'blessing' : 'blessings';
        stockCounter.textContent = `${stockRemaining} of ${STOCK_TOTAL} ${word} remaining`;
      }
    }

    buyBtn.addEventListener('click', () => {
      if (stockRemaining <= 0) return;
      stockRemaining -= 1;
      applyState();
    });

    applyState();
  </script>

</body>
</html>
