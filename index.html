<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE GOD SHOP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garant:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --gold: #C9A84C;
      --gold-dim: rgba(201, 168, 76, 0.7);
      --bg-base: #92959A;
      --white: #F8F5EF;
      --white-dim: rgba(248, 245, 239, 0.65);
    }

    html, body {
      height: 100%;
    }

    @keyframes bgBreath {
      0%   { background-position: 50% 50%; opacity: 1; }
      25%  { background-position: 55% 45%; opacity: 0.95; }
      50%  { background-position: 50% 52%; opacity: 1; }
      75%  { background-position: 45% 50%; opacity: 0.97; }
      100% { background-position: 50% 50%; opacity: 1; }
    }

    @keyframes bgRotate {
      0%   { transform: rotate(0deg)   scale(1.0); }
      50%  { transform: rotate(180deg) scale(1.08); }
      100% { transform: rotate(360deg) scale(1.0); }
    }

    @keyframes rayRotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes glowPulse {
      0%   { opacity: 0.55; transform: scale(1.0); }
      50%  { opacity: 0.75; transform: scale(1.07); }
      100% { opacity: 0.55; transform: scale(1.0); }
    }

    body {
      background-color: var(--bg-base);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
    }

    /* ─── ANIMATED BACKGROUND ─── */

    body::before {
      content: '';
      position: fixed;
      inset: -20%;
      background: radial-gradient(ellipse at 50% 40%,
        #A8ABB0 0%,
        #8E9196 35%,
        #7A7D82 65%,
        #868990 100%
      );
      animation: bgRotate 12s linear infinite;
      z-index: 0;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 38%,
        rgba(180, 170, 145, 0.25) 0%,
        rgba(140, 130, 110, 0.12) 40%,
        transparent 70%
      );
      animation: bgBreath 10s ease-in-out infinite;
      z-index: 0;
      pointer-events: none;
    }

    /* ─── HEADER ─── */

    .site-header {
      text-align: center;
      padding-top: clamp(14px, 2.5vh, 28px);
      position: relative;
      z-index: 1;
      flex-shrink: 0;
    }

    .site-name {
      font-family: 'Cormorant Garant', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(1.8rem, 4.5vw, 3rem);
      letter-spacing: 0.04em;
      line-height: 1.1;
      color: var(--white);
    }

    .site-name .gold {
      color: var(--gold);
    }

    .site-tagline {
      margin-top: 6px;
      font-family: 'Cormorant Garant', serif;
      font-style: normal;
      font-weight: 300;
      font-size: clamp(0.6rem, 1.2vw, 0.78rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--white-dim);
    }

    /* ─── VIDEO AREA ─── */

    .video-area {
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* divine glow wrapper */
    .video-glow {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* soft radial halo behind video */
    .video-glow::before {
      content: '';
      position: absolute;
      inset: -28%;
      border-radius: 50%;
      background: radial-gradient(ellipse 70% 80% at 50% 50%,
        rgba(255, 252, 240, 0.55) 0%,
        rgba(230, 215, 175, 0.28) 30%,
        rgba(200, 185, 140, 0.12) 55%,
        transparent 72%
      );
      animation: glowPulse 6s ease-in-out infinite;
      pointer-events: none;
      z-index: -1;
    }

    /* conic ray burst */
    .video-glow::after {
      content: '';
      position: absolute;
      inset: -45%;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        rgba(255, 252, 235, 0.04) 4deg,
        transparent 8deg,
        rgba(255, 252, 235, 0.03) 14deg,
        transparent 18deg,
        rgba(255, 252, 235, 0.05) 22deg,
        transparent 28deg,
        rgba(255, 252, 235, 0.02) 34deg,
        transparent 38deg,
        rgba(255, 252, 235, 0.04) 44deg,
        transparent 50deg,
        rgba(255, 252, 235, 0.03) 56deg,
        transparent 62deg,
        rgba(255, 252, 235, 0.05) 66deg,
        transparent 72deg,
        rgba(255, 252, 235, 0.02) 78deg,
        transparent 84deg,
        rgba(255, 252, 235, 0.04) 90deg,
        transparent 96deg,
        rgba(255, 252, 235, 0.03) 104deg,
        transparent 110deg,
        rgba(255, 252, 235, 0.05) 116deg,
        transparent 122deg,
        rgba(255, 252, 235, 0.02) 130deg,
        transparent 136deg,
        rgba(255, 252, 235, 0.04) 144deg,
        transparent 150deg,
        rgba(255, 252, 235, 0.03) 158deg,
        transparent 164deg,
        rgba(255, 252, 235, 0.05) 170deg,
        transparent 176deg,
        rgba(255, 252, 235, 0.02) 182deg,
        transparent 188deg,
        rgba(255, 252, 235, 0.04) 196deg,
        transparent 202deg,
        rgba(255, 252, 235, 0.03) 210deg,
        transparent 216deg,
        rgba(255, 252, 235, 0.05) 222deg,
        transparent 228deg,
        rgba(255, 252, 235, 0.02) 234deg,
        transparent 240deg,
        rgba(255, 252, 235, 0.04) 248deg,
        transparent 254deg,
        rgba(255, 252, 235, 0.03) 262deg,
        transparent 268deg,
        rgba(255, 252, 235, 0.05) 274deg,
        transparent 280deg,
        rgba(255, 252, 235, 0.02) 286deg,
        transparent 292deg,
        rgba(255, 252, 235, 0.04) 298deg,
        transparent 304deg,
        rgba(255, 252, 235, 0.03) 312deg,
        transparent 318deg,
        rgba(255, 252, 235, 0.05) 324deg,
        transparent 330deg,
        rgba(255, 252, 235, 0.02) 336deg,
        transparent 342deg,
        rgba(255, 252, 235, 0.04) 350deg,
        transparent 356deg,
        transparent 360deg
      );
      animation: rayRotate 18s linear infinite;
      pointer-events: none;
      z-index: -1;
      mask-image: radial-gradient(ellipse 70% 80% at 50% 50%, black 25%, transparent 72%);
      -webkit-mask-image: radial-gradient(ellipse 70% 80% at 50% 50%, black 25%, transparent 72%);
    }

    .manifestation-video {
      display: block;
      width: clamp(160px, 24vw, 320px);
      height: auto;
      max-height: clamp(200px, 46vh, 520px);
      object-fit: cover;
      background: #1C1B19;
      box-shadow:
        0 0 0 1px rgba(201, 168, 76, 0.2),
        0 8px 40px rgba(0, 0, 0, 0.35),
        0 0 60px rgba(255, 248, 220, 0.08);
      position: relative;
      z-index: 1;
    }

    /* ─── PRODUCT INFO ─── */

    .product-info {
      text-align: center;
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      padding: 0 16px;
    }

    .product-verse {
      font-family: 'Cormorant Garant', serif;
      font-weight: 400;
      font-style: normal;
      font-size: clamp(0.6rem, 1.1vw, 0.75rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      line-height: 1.6;
      margin-bottom: 4px;
    }

    .product-name {
      font-family: 'Cormorant Garant', serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(1.1rem, 2.6vw, 1.7rem);
      letter-spacing: 0.06em;
      color: var(--gold);
      line-height: 1.2;
    }

    .product-actions {
      margin-top: clamp(6px, 1.2vh, 14px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .price {
      font-family: 'Cormorant Garant', serif;
      font-weight: 300;
      font-size: clamp(1rem, 2vw, 1.35rem);
      letter-spacing: 0.08em;
      color: var(--white-dim);
    }

    .btn-buy {
      padding: 9px 22px;
      background: transparent;
      color: var(--gold);
      border: 1px solid rgba(201, 168, 76, 0.5);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 0.6rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
      line-height: 1;
      white-space: nowrap;
    }

    .btn-buy:hover:not(:disabled) {
      background: rgba(201, 168, 76, 0.15);
      border-color: var(--gold);
    }

    .btn-buy:disabled,
    body[data-state="sold-out"] .btn-buy {
      color: rgba(201, 168, 76, 0.35);
      border-color: rgba(201, 168, 76, 0.2);
      cursor: not-allowed;
    }

    .stock-counter {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      color: rgba(248, 245, 239, 0.4);
      margin-top: 6px;
      text-align: center;
    }

    body[data-state="sold-out"] .stock-counter {
      color: var(--gold-dim);
    }

    /* ─── COUNTDOWN ─── */

    .countdown-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 10px;
      margin-top: clamp(4px, 0.8vh, 10px);
    }

    .countdown-label {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(248, 245, 239, 0.38);
    }

    .countdown-timer {
      font-family: 'Cormorant Garant', serif;
      font-weight: 300;
      font-size: clamp(0.85rem, 1.6vw, 1.1rem);
      letter-spacing: 0.1em;
      color: rgba(248, 245, 239, 0.55);
      font-variant-numeric: tabular-nums;
    }

    /* ─── FOOTER NAV ─── */

    .site-footer {
      text-align: center;
      padding-bottom: clamp(12px, 2vh, 22px);
      position: relative;
      z-index: 1;
      flex-shrink: 0;
    }

    .footer-nav {
      font-family: 'Cormorant Garant', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(0.65rem, 1.2vw, 0.8rem);
      letter-spacing: 0.18em;
      color: var(--white-dim);
      list-style: none;
      display: flex;
      gap: 24px;
      justify-content: center;
    }

    .footer-nav a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-nav a:hover {
      color: var(--white);
    }

    /* ─── BETWEEN-DROPS STATE ─── */

    body[data-state="between-drops"] .product-info {
      opacity: 0.45;
      pointer-events: none;
    }

    /* ─── MOBILE ─── */

    @media (max-width: 480px) {
      .product-actions {
        flex-direction: column;
        gap: 10px;
      }

      .footer-nav {
        gap: 16px;
      }
    }
  </style>
</head>
<body data-state="active">

  <!-- ─── HEADER ─── -->
  <header class="site-header">
    <h1 class="site-name">the-<span class="gold">god</span>-shop</h1>
    <p class="site-tagline">Daily Manifestation Altar</p>
  </header>

  <!-- ─── VIDEO ─── -->
  <div class="video-area">
    <div class="video-glow">
      <video
        class="manifestation-video"
        src="video.mp4"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
      ></video>
    </div>
  </div>

  <!-- ─── PRODUCT ─── -->
  <div class="product-info">
    <p class="product-verse">Today's Holy Manifestation:</p>
    <p class="product-name">Genesis 847:3 — The Silicone Spatula</p>

    <div class="product-actions">
      <span class="price">€79.00</span>
      <button class="btn-buy" id="buyBtn">Receive Thy Blessing</button>
    </div>
    <p class="stock-counter" id="stockCounter">3 of 7 blessings remaining</p>

    <div class="countdown-row">
      <span class="countdown-label">Next Manifestation</span>
      <span class="countdown-timer" id="countdown">--:--:--</span>
    </div>
  </div>

  <!-- ─── FOOTER ─── -->
  <footer class="site-footer">
    <ul class="footer-nav">
      <li><a href="#">Manifestations</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </footer>

  <script>
    // ─── COUNTDOWN TO NEXT 3:33 AM ───────────────────────────────────────────

    function getNext333AM() {
      const now = new Date();
      const target = new Date(now);
      target.setHours(3, 33, 0, 0);

      // If we've already passed 3:33 AM today, aim for tomorrow
      if (now >= target) {
        target.setDate(target.getDate() + 1);
      }

      return target;
    }

    function formatCountdown(ms) {
      if (ms <= 0) return '00:00:00';

      const totalSeconds = Math.floor(ms / 1000);
      const hours   = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      const pad = n => String(n).padStart(2, '0');
      return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
    }

    const countdownEl = document.getElementById('countdown');

    function tickCountdown() {
      const now = new Date();
      const target = getNext333AM();
      const diff = target - now;
      countdownEl.textContent = formatCountdown(diff);
    }

    tickCountdown();
    setInterval(tickCountdown, 1000);


    // ─── STATE MANAGEMENT ────────────────────────────────────────────────────

    const STOCK_TOTAL = 7;
    let stockRemaining = 3; // current mock state

    const buyBtn       = document.getElementById('buyBtn');
    const stockCounter = document.getElementById('stockCounter');

    function applyState() {
      const body = document.body;

      if (stockRemaining <= 0) {
        body.dataset.state = 'sold-out';
        buyBtn.textContent = 'God Has Spoken. All Blessings Claimed.';
        buyBtn.disabled = true;
        stockCounter.textContent = 'All 7 blessings have been claimed';
      } else {
        body.dataset.state = 'active';
        buyBtn.textContent = 'Receive Thy Blessing';
        buyBtn.disabled = false;
        const word = stockRemaining === 1 ? 'blessing' : 'blessings';
        stockCounter.textContent = `${stockRemaining} of ${STOCK_TOTAL} ${word} remaining`;
      }
    }

    buyBtn.addEventListener('click', () => {
      if (stockRemaining <= 0) return;
      stockRemaining -= 1;
      applyState();
    });

    applyState();
  </script>

</body>
</html>
